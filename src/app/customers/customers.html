<div class="container mt-2">
    <div class="card" >
      <div class="card-header">Customers</div>
      <div class="card-body">
        <table class="table">
          <thead>
          <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
          </tr>
          </thead>
          <tbody>
            @for (customer of customers; track customer.id) {
              <tr>
                <td>{{ customer.id }}</td>
                <td>{{ customer.name }}</td>
                <td>{{ customer.email }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="text-center">No customers found</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
</div>
